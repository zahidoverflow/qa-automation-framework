name: Regression Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:
    inputs:
      test_controller:
        description: 'Test Controller CSV file to execute'
        required: true
        default: 'Pipeline_RegressionTestController.csv'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright Regression Tests
      env:
        USER_PORTAL_URL: ${{ secrets.USER_PORTAL_URL }}
        USER_PORTAL_USERNAME: ${{ secrets.USER_PORTAL_USERNAME }}
        USER_PORTAL_PASSWORD: ${{ secrets.USER_PORTAL_PASSWORD }}
        TEST_PARALLEL: true
        TEST_PARALLEL_WORKERS: 4
      run: npm test ${{ github.event.inputs.test_controller || 'Pipeline_RegressionTestController.csv' }}

    - name: Upload Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-node-${{ matrix.node-version }}
        path: AllTestResults/
        retention-days: 30
